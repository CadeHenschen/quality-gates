name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, vet, test
    runs-on: [self-hosted, roost-r]
    container:
      image: golang:1.26-alpine
    steps:
      # actions/checkout is a Node-based action; golang:1.26-alpine has no
      # Node.js by default. Same workaround as this module's four
      # predecessor repos' CI (and gamectl's).
      - name: Install Node (checkout), Python (radon), curl (npm fixture fetch)
        run: apk add --no-cache nodejs npm curl python3 py3-pip

      - uses: https://code.forgejo.org/actions/checkout@v4

      # radon/coverage back crap-metric's Python analyzer tests; the TS
      # fixtures back crap-metric's and dupe-metric's TypeScript
      # adapter tests (including the TS7 fallback path — see CLAUDE.md).
      # The javascript fixtures reuse the same complexity.js/scanner.js
      # adapters (plain JS is a superset the classic TS compiler parses
      # natively) and need the same `typescript` devDependency installed.
      # Every analyzer/tokenizer/importer test skips itself when its
      # underlying tool isn't present rather than failing, so this step
      # existing is what turns "skipped" into "actually exercised" in CI.
      # --break-system-packages: Alpine's pip enforces PEP 668 by default.
      - name: Install radon/coverage and TS/JS fixture deps
        run: |
          pip install --break-system-packages --quiet radon coverage
          npm install --prefix testdata/crap/typescript --no-audit --no-fund
          npm install --prefix testdata/crap/typescript-ts7 --no-audit --no-fund
          npm install --prefix testdata/crap/typescript-size --no-audit --no-fund
          npm install --prefix testdata/crap/javascript --no-audit --no-fund
          npm install --prefix testdata/dupe/typescript --no-audit --no-fund
          npm install --prefix testdata/dupe/typescript-ts7 --no-audit --no-fund
          npm install --prefix testdata/dupe/javascript --no-audit --no-fund
          npm install --prefix testdata/test/typescript --no-audit --no-fund

      # This job installs every tool/fixture every analyzer, tokenizer, and
      # importer test needs (radon, node, python3, all seven npm fixture
      # dirs), so none of their self-skip guards should ever fire here — a
      # SKIP in this job's own output means a dependency this job should
      # provide is missing, not a legitimate skip. Asserted explicitly
      # rather than trusted, since `go test`'s own exit code is 0 either
      # way and a skipped assertion is silently the same as no assertion
      # at all: the exact class of gap that let `--lang js` stay broken
      # for months (see CLAUDE.md) and that let this repo's own self-check
      # job (below) run its coverage step against a partially-skipped
      # suite without anyone noticing.
      - name: go build / vet / test
        run: |
          go build ./...
          go vet ./...
          go test ./... -v > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            exit $status
          fi
          if grep -q '^--- SKIP' test.log; then
            echo "unexpected test skips — a tool/fixture this job should provide is missing:" >&2
            grep '^--- SKIP' test.log >&2
            exit 1
          fi

  # No `needs:` — runs in parallel with `test` (this runner has 4
  # concurrent job slots, not 1). golangci-lint doesn't need the
  # radon/npm fixture deps `test` installs to exercise the analyzers —
  # just Node for checkout and the Go toolchain already in this image.
  lint:
    name: Lint
    runs-on: [self-hosted, roost-r]
    container:
      image: golang:1.26-alpine
    steps:
      # curl is needed by install-golangci-lint's own download step, not
      # just checkout — the alpine base image has neither by default.
      - name: Install Node (required by actions/checkout), curl (release download)
        run: apk add --no-cache nodejs curl

      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: http://forgejo:3000/cadeh/ci-workflows/actions/install-golangci-lint@main

      - name: golangci-lint
        run: golangci-lint run ./...

  lint-workflows:
    name: Lint workflow files
    runs-on: [self-hosted, roost-r]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: http://forgejo:3000/cadeh/ci-workflows/actions/install-actionlint@main

      # -ignore: actionlint's `action` rule only understands GitHub's
      # {owner}/{repo}@{ref} shorthand, not Forgejo's full-URL `uses:`
      # syntax used everywhere in this file — every other rule (invalid
      # expressions, unknown context vars, embedded shellcheck on `run:`
      # blocks, empty `jobs:`, etc.) still applies.
      - name: actionlint
        run: actionlint -config-file .forgejo/actionlint.yaml -ignore 'specifying action .* in invalid format' .forgejo/workflows/*.yml

  release:
    name: Release binaries
    runs-on: [self-hosted, roost-r]
    needs: [test, lint, lint-workflows]
    if: github.ref == 'refs/heads/main'
    container:
      image: golang:1.26-alpine
    steps:
      - name: Install Node (checkout) and curl (release API calls)
        run: apk add --no-cache nodejs curl

      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build linux/amd64 and darwin/arm64 binaries
        env:
          SHA: ${{ github.sha }}
        # darwin/arm64 added alongside linux/amd64 for the mac-mini runner
        # (self-hosted, macos, Apple Silicon) — health-suite's Xcode-based
        # jobs run there and can't exec the linux/amd64 binaries. Plain
        # `go build` cross-compiles fine for both from this one Alpine
        # container; nothing OS-specific in this module needs cgo.
        #
        # -ldflags "-X main.version=..." bakes the same short SHA used for
        # the release tag into each binary's `version` subcommand, same
        # convention as gamectl's `-X main.version=$APP_VERSION`. Lets a
        # consumer that pinned an install to an older release (see
        # ci-workflows' install-quality-gates `version` input) confirm
        # what it's actually running.
        run: |
          TAG=${SHA:0:7}
          LDFLAGS="-X main.version=$TAG"

          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o crap-metric-linux-amd64     ./cmd/crap-metric
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dupe-metric-linux-amd64     ./cmd/dupe-metric
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o escape-metric-linux-amd64   ./cmd/escape-metric
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o cycle-metric-linux-amd64    ./cmd/cycle-metric
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o arch-metric-linux-amd64     ./cmd/arch-metric
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o test-metric-linux-amd64     ./cmd/test-metric
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dead-metric-linux-amd64     ./cmd/dead-metric
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o crap-metric-darwin-arm64    ./cmd/crap-metric
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dupe-metric-darwin-arm64    ./cmd/dupe-metric
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o escape-metric-darwin-arm64  ./cmd/escape-metric
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o cycle-metric-darwin-arm64   ./cmd/cycle-metric
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o arch-metric-darwin-arm64    ./cmd/arch-metric
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o test-metric-darwin-arm64    ./cmd/test-metric
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dead-metric-darwin-arm64    ./cmd/dead-metric

      - name: Create release and upload binaries
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        # One release per push, tagged with the short commit SHA, carrying
        # all four binaries (previously four separate per-tool releases
        # across four repos). Same conventions as those repos' CI, carried
        # forward: github.sha instead of `git rev-parse` (no git in this
        # container — checkout@v4 falls back to a tarball download without
        # it); the `^{"id":` anchor on the sed extract (a bare greedy
        # match grabs the release author's nested id instead of the
        # release's own — a real incident in crap-metric's first CI run);
        # look-up-by-tag-first so a re-run reuses the release instead of
        # erroring on a duplicate tag, with the upload loop always
        # (re-)attempted afterward so a run that created the release but
        # died before uploading gets repaired by the next run.
        run: |
          TAG=${SHA:0:7}
          API="https://git.roost-r.com/api/v1/repos/cadeh/quality-gates"

          ID=$(curl -sS -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" \
            | sed -n 's/^{"id":\([0-9]*\).*/\1/p')

          if [ -z "$ID" ]; then
            RESP=$(curl -sS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"target_commitish\":\"main\",\"draft\":false,\"prerelease\":false}" \
              "$API/releases")
            ID=$(echo "$RESP" | sed -n 's/^{"id":\([0-9]*\).*/\1/p')
            if [ -z "$ID" ]; then
              echo "failed to create release: $RESP" >&2
              exit 1
            fi
          fi

          for BIN in crap-metric dupe-metric escape-metric cycle-metric arch-metric test-metric dead-metric; do
            for PLATFORM in linux-amd64 darwin-arm64; do
              curl -sS -X POST -H "Authorization: token $TOKEN" \
                -F "attachment=@${BIN}-${PLATFORM}" \
                "$API/releases/$ID/assets?name=${BIN}-${PLATFORM}"
            done
          done

      - name: Delete releases beyond retention (keep newest 20)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Now that releases carry only distribution binaries — no report
        # history hangs off them (see the self-check job's `reports`
        # branch instead) — nothing needs them kept forever. `grep -o` on
        # "tag_name" is safe against the array's single line of compact
        # JSON: unlike "id" (which also appears nested under each
        # release's author, the exact ambiguity the lookup-by-tag step
        # above avoids by anchoring on `^{"id":`), "tag_name" only ever
        # appears once per release object. Relies on this endpoint's
        # newest-first order — the same assumption this repo's trend
        # lookup used to rely on before it moved to the `reports` branch.
        run: |
          API="https://git.roost-r.com/api/v1/repos/cadeh/quality-gates"
          TAGS=$(curl -sS -H "Authorization: token $TOKEN" "$API/releases?limit=100" \
            | grep -o '"tag_name":"[^"]*"' | sed 's/"tag_name":"\(.*\)"/\1/')

          KEEP=20
          i=0
          for OLDTAG in $TAGS; do
            i=$((i + 1))
            if [ "$i" -le "$KEEP" ]; then
              continue
            fi
            curl -sS -X DELETE -H "Authorization: token $TOKEN" "$API/releases/tags/$OLDTAG"
          done

  # Gates the PR itself, not just main after the fact: the job below
  # (`self-check`) only runs post-merge (needs the `release` job, which is
  # main-only, to get a real release to install and a real commit to
  # advance the `reports` branch against) — so before this job existed, a
  # PR that pushed this repo's own duplication/CRAP/escape-hatch rate over
  # its self-check threshold only found out *after* merging, when the gate
  # had already let it through. This job runs the same three `check`
  # commands against the PR's own checkout, with no release, no
  # reports-branch trend comparison, and no artifact upload — none of
  # that's meaningful for a commit that isn't on main yet.
  self-check-pr:
    name: Quality gate self-checks (PR)
    runs-on: [self-hosted, roost-r]
    if: github.event_name == 'pull_request'
    container:
      image: golang:1.26-alpine
    steps:
      - name: Install Node (checkout), Python (radon)
        run: apk add --no-cache nodejs npm python3 py3-pip

      - uses: https://code.forgejo.org/actions/checkout@v4

      # Same reasoning as the "test" job and the post-merge "self-check"
      # job: without these, crap-metric's/dupe-metric's own analysis of
      # *this repo's* Python/TypeScript/JavaScript paths would silently
      # see 0% coverage or an empty result instead of exercising them for
      # real — which would make this job's own gate meaninglessly green
      # (or, worse, permanently red on unrelated grounds regardless of
      # what a given PR actually touches).
      - name: Install radon/coverage and TS/JS fixture deps
        run: |
          pip install --break-system-packages --quiet radon coverage
          npm install --prefix testdata/crap/typescript --no-audit --no-fund
          npm install --prefix testdata/crap/typescript-ts7 --no-audit --no-fund
          npm install --prefix testdata/crap/typescript-size --no-audit --no-fund
          npm install --prefix testdata/crap/javascript --no-audit --no-fund
          npm install --prefix testdata/dupe/typescript --no-audit --no-fund
          npm install --prefix testdata/dupe/typescript-ts7 --no-audit --no-fund
          npm install --prefix testdata/dupe/javascript --no-audit --no-fund
          npm install --prefix testdata/test/typescript --no-audit --no-fund

      # Built straight from this PR's own checkout rather than installed
      # from a release — there is no release for an unmerged commit, and
      # cutting one just to self-check a PR would defeat the point of
      # keeping releases as post-merge-only distribution artifacts (see
      # CLAUDE.md's "Releases are for distribution only" entry). No
      # -ldflags version needed here; this build never leaves the job.
      - name: Build binaries
        run: go build -o . ./cmd/crap-metric ./cmd/dupe-metric ./cmd/escape-metric ./cmd/arch-metric ./cmd/test-metric ./cmd/dead-metric

      # Same "SKIP means a dependency is missing" assertion as the "test"
      # and post-merge "self-check" jobs.
      - name: Generate Go coverage
        run: |
          go test -coverprofile=cover.out -v ./... > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            exit $status
          fi
          if grep -q '^--- SKIP' test.log; then
            echo "unexpected test skips — a tool/fixture this job should provide is missing:" >&2
            grep '^--- SKIP' test.log >&2
            exit 1
          fi

      - name: crap-metric check (self)
        run: ./crap-metric check --lang go --dir . --coverage cover.out --fail-above 30 --verbose

      - name: dupe-metric check (self)
        # --fail-above 18 — see CLAUDE.md's "dupe-metric self-check
        # threshold" entry and the matching step in the post-merge
        # "self-check" job below for the full reasoning.
        run: ./dupe-metric check --lang go --dir . --fail-above 18

      - name: escape-metric check (self)
        run: ./escape-metric check --lang go --dir . --fail-above 1

      # Gated by this repo's own .arch-metric-rules.json at the module
      # root (cmd binaries stay independent; internal packages never
      # depend on a cmd binary). The one tool here besides
      # crap/dupe/escape whose Go support is a real analysis, not a
      # "--lang go isn't supported" error — see README's arch-metric
      # section for why Go needs this tool specifically.
      - name: arch-metric check (self)
        run: ./arch-metric check --lang go --dir . --fail-above 0

      # No rules file needed — stability is computed structurally from
      # the same import graph `check` builds, gated on Robert Martin's
      # Stable Dependencies Principle (a stable package must never depend
      # on a less stable one). See README's arch-metric section.
      - name: arch-metric stability (self)
        run: ./arch-metric stability --lang go --dir . --fail-above 0

      # Static test-quality gate over this repo's own Go tests: no test
      # without an assertion, no unconditional skip. Mutation testing is
      # deliberately not self-checked — it needs a go-gremlins run over
      # the whole module, too slow for every push; the `mutation`
      # subcommand only parses a report a repo's own CI produces.
      - name: test-metric check (self)
        run: ./test-metric check --lang go --dir . --fail-above 0

      # dead-metric ingests `deadcode`'s report rather than detecting
      # anything itself. No `-test`: code only tests use counts as dead
      # (see README's dead-metric section). Pinned; renovate can bump it.
      - name: dead-metric check (self)
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.50.0
          "$(go env GOPATH)/bin/deadcode" -json ./... > deadcode.json
          ./dead-metric --report deadcode.json --fail-above 0

      # No cycle-metric self-check — see the post-merge "self-check"
      # job's matching note: it only analyzes Python/TS, and this repo is
      # Go.

  self-check:
    name: Quality gate self-checks (post-merge trend)
    runs-on: [self-hosted, roost-r]
    needs: [release]
    if: github.ref == 'refs/heads/main'
    container:
      image: golang:1.26-alpine
    steps:
      # git + bash: git to read/advance the `reports` branch below (this
      # job's git plumbing is written for sh, but roost-r-git-auth's own
      # step is `shell: bash`); bash needed for that action to run inside
      # this alpine container.
      - name: Install Node (checkout), curl (install action), Python (radon), git+bash (reports branch)
        run: apk add --no-cache nodejs npm curl python3 py3-pip git bash

      - uses: https://code.forgejo.org/actions/checkout@v4

      # checkout@v4's own auth doesn't carry over to the separate git
      # fetch/push of the `reports` branch further down this job.
      - name: authenticate for reports-branch push
        uses: http://forgejo:3000/cadeh/ci-workflows/actions/roost-r-git-auth@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Same reasoning as the "test" job: without these, crap-metric's own
      # Python/TypeScript analysis of *this repo* would silently see 0%
      # for those paths rather than exercising them for real. This step
      # used to install only the two crap/typescript fixture dirs — the
      # "Generate Go coverage" step below runs the *whole* `go test ./...`
      # suite (not just crap-metric's own check), so it needs every
      # fixture dir the "test" job installs, or its coverage number is
      # quietly built on some skipped tests too.
      - name: Install radon/coverage and TS/JS fixture deps
        run: |
          pip install --break-system-packages --quiet radon coverage
          npm install --prefix testdata/crap/typescript --no-audit --no-fund
          npm install --prefix testdata/crap/typescript-ts7 --no-audit --no-fund
          npm install --prefix testdata/crap/typescript-size --no-audit --no-fund
          npm install --prefix testdata/crap/javascript --no-audit --no-fund
          npm install --prefix testdata/dupe/typescript --no-audit --no-fund
          npm install --prefix testdata/dupe/typescript-ts7 --no-audit --no-fund
          npm install --prefix testdata/dupe/javascript --no-audit --no-fund
          npm install --prefix testdata/test/typescript --no-audit --no-fund

      # http://forgejo:3000/..., not https://git.roost-r.com/... — see
      # ci-workflows' README on why the internal hostname is required for
      # cross-repo action fetches on this runner. One action now installs
      # all four binaries (previously four separate install-*-metric
      # actions).
      - uses: http://forgejo:3000/cadeh/ci-workflows/actions/install-quality-gates@main

      # Same "SKIP means a dependency is missing" assertion as the "test"
      # job — now that this job installs the full fixture set above, a
      # SKIP here should never happen either.
      - name: Generate Go coverage
        run: |
          go test -coverprofile=cover.out -v ./... > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            exit $status
          fi
          if grep -q '^--- SKIP' test.log; then
            echo "unexpected test skips — a tool/fixture this job should provide is missing:" >&2
            grep '^--- SKIP' test.log >&2
            exit 1
          fi

      - name: crap-metric check (self)
        run: crap-metric check --lang go --dir . --coverage cover.out --fail-above 30 --verbose

      - name: dupe-metric check (self)
        # --fail-above 18, not the tool's own default of 5: merging four
        # previously-independent, structurally-similar CLIs into one repo
        # legitimately raised this repo's own baseline duplication rate —
        # see CLAUDE.md's "dupe-metric self-check threshold" entry for the
        # full reasoning (measured ~15% right after the merge, largely
        # cross-tool structural echoes like parallel python/typescript
        # adapters, not same-tool copy-paste; two real, clean extractions
        # already happened — internal/ratchet.Load, internal/reportio —
        # this is what's left after those).
        run: dupe-metric check --lang go --dir . --fail-above 18

      - name: escape-metric check (self)
        run: escape-metric check --lang go --dir . --fail-above 1

      # `go run`, not the installed binary: ci-workflows'
      # install-quality-gates doesn't fetch arch-metric yet either, and
      # this gate shouldn't depend on a change in another repo. Same
      # .arch-metric-rules.json and reasoning as the PR job above.
      - name: arch-metric check (self)
        run: go run ./cmd/arch-metric check --lang go --dir . --fail-above 0

      - name: arch-metric stability (self)
        run: go run ./cmd/arch-metric stability --lang go --dir . --fail-above 0

      # `go run`, not the installed binary: ci-workflows'
      # install-quality-gates only fetches the four older binaries until
      # that action learns about test-metric, and this gate shouldn't
      # depend on a change in another repo.
      - name: test-metric check (self)
        run: go run ./cmd/test-metric check --lang go --dir . --fail-above 0

      - name: dead-metric check (self)
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.50.0
          "$(go env GOPATH)/bin/deadcode" -json ./... > deadcode.json
          go run ./cmd/dead-metric --report deadcode.json --fail-above 0

      # No cycle-metric self-check — it only analyzes Python/TS, and this
      # repo is Go, so there's no source of its own it could check. See
      # README's "cycle-metric excludes Go" note.

      - name: Compare crap trend against previous report
        if: always()
        # Previous run's report now lives on a dedicated `reports` branch
        # (see the "Advance reports branch" step below) instead of as a
        # release asset — no Releases API pagination, no Python urllib +
        # User-Agent workaround needed for this lookup at all.
        run: |
          git fetch origin reports 2>/dev/null || true

          if git rev-parse --verify origin/reports >/dev/null 2>&1; then
            git show origin/reports:crap-report.json > prev-crap-report.json 2>/dev/null || true
          fi

          if [ -f prev-crap-report.json ]; then
            echo "comparing against reports branch tip"
            crap-metric diff --old prev-crap-report.json --new crap-report.json
          else
            echo "no previous report to compare against (first run, or reports branch predates this feature)"
          fi

      - name: Upload reports as workflow artifacts
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            crap-report.json
            dupe-report.json
            escape-report.json
            arch-report.json

      - name: Advance reports branch with this run's report
        if: always()
        env:
          SHA: ${{ github.sha }}
        # `reports` carries nothing but crap-report.json — one commit per
        # self-check run — so the next run's trend comparison above always
        # has a same-branch predecessor to read. Built in a separate git
        # worktree so this step can't disturb the job's actual checkout
        # (still needed as-is by later steps in this same job).
        run: |
          TAG=${SHA:0:7}
          git config user.email "ci@roost-r.com"
          git config user.name "quality-gates-ci"

          rm -rf /tmp/reports-worktree
          if git rev-parse --verify origin/reports >/dev/null 2>&1; then
            git worktree add --detach /tmp/reports-worktree origin/reports
          else
            git worktree add --detach /tmp/reports-worktree
            # --orphan repoints the branch but leaves the checked-out main
            # tree (including .gitignore, which ignores crap-report.json)
            # in place, so `git add crap-report.json` below would be
            # refused as ignored. Clear it so the orphan tree starts empty.
            (cd /tmp/reports-worktree && git checkout --orphan reports && git rm -rf --quiet .)
          fi

          cp crap-report.json /tmp/reports-worktree/crap-report.json
          cd /tmp/reports-worktree || exit 1
          git add crap-report.json
          git commit --quiet -m "crap-report for $TAG"
          git push origin HEAD:refs/heads/reports
